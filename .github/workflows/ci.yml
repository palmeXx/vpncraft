name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      # Lints and vets linux, darwin and windows build-tagged sources.
      - run: make fmt-check vet lint

  vuln:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # govulncheck for linux, darwin and windows; version pinned in the Makefile.
      - run: make vuln

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests (race)
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: Integration tests
        if: runner.os == 'Windows' # runner is Administrator: raw-socket tests run
        run: go test -count=1 -tags integration -v ./test/integration/...
      - name: Integration tests
        if: runner.os != 'Windows'
        run: |
          make test-integration
          make test-integration-privileged # passwordless sudo on hosted runners

  build:
    name: Build binaries
    needs: [lint, vuln, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags for `git describe`
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: make checksums
      - name: Show embedded build info
        run: ./dist/vpncraft_linux_amd64 -version
      - uses: actions/upload-artifact@v7
        with:
          name: vpncraft-binaries
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vpncraft-binaries
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "vpncraft $TAG" \
            --generate-notes \
            $prerelease
